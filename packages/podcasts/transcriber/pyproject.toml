[project]
name = "e-podcasts-transcriber"
version = "0.1.0"
description = "Local audio -> transcript pipeline of e-podcasts (faster-whisper + diarize), driven by `pnpm transcribe`."
requires-python = ">=3.12,<3.13"
dependencies = [
  "av>=14,<17",
  "diarize>=0.1.2",
  "faster-whisper>=1.2.1",
  "yt-dlp[default]>=2026.10.26",
]

[project.optional-dependencies]
# Plan B diarizer (DESIGN.md §7.4): not installed by default. Needs HF_TOKEN.
pyannote = ["pyannote-audio>=4.0"]

[project.scripts]
epod-transcribe = "epod_transcriber.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "epod_transcriber"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["jiwer>=4.0.0", "pytest>=8"]
