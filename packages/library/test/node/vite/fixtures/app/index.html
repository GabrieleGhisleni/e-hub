<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Una biblioteca personale: libri, letture e appunti." />
    <meta name="theme-color" content="#f8f5ef" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='3' width='20' height='26' rx='2' fill='%237c2d24'/%3E%3Crect x='6' y='3' width='3' height='26' rx='1' fill='%23571d17'/%3E%3Cpath d='M12 10h10M12 14h7' stroke='%23f3e9d6' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>e-library</title>
    <!--
      No flash of the wrong theme: apply the saved choice (or the system one) before first paint.
      Keep in sync with src/web/theme/theme.ts (storage key "elib-theme", theme colours).
    -->
    <script>
      (function () {
        var dark = false;
        try {
          var saved = window.localStorage.getItem("elib-theme");
          dark =
            saved === "dark" ||
            (saved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        } catch (e) {
          try {
            dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          } catch (e2) {}
        }
        if (dark) {
          document.documentElement.classList.add("dark");
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", "#13161d");
        }
      })();
    </script>
    <style>
      html {
        background: #f8f5ef;
        color-scheme: light;
      }
      html.dark {
        background: #13161d;
        color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Questo sito ha bisogno di JavaScript per mostrare la biblioteca.</noscript>
  </body>
</html>
