<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="e-hub: libreria personale, podcast ed esplorazioni." />
    <meta name="theme-color" content="#f8f5ef" />
    <link rel="icon" href="%BASE_URL%ehub.svg" />
    <title>e-hub</title>
    <!--
      Hosted site: the admin controls (`__ELIB_ADMIN__`) are gated on a valid login. The Vite dev server reads that
      flag once, when its client loads, before any module runs; so set it here, ahead of every module. src/session.ts
      sets it again (same rule) at startup.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("ehub.session");
          var p = t && JSON.parse(atob(t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
          window.__EHUB_ADMIN__ = !!(p && p.email && p.exp * 1000 > Date.now());
        } catch (e) {
          window.__EHUB_ADMIN__ = false;
        }
      })();
    </script>
    <!--
      No flash of the wrong theme: apply the saved choice (or the system one) before first paint.
      Keep in sync with packages/ui/src/theme.tsx (storage key "ehub-theme", theme colours).
    -->
    <script>
      (function () {
        var dark = false;
        try {
          var saved = window.localStorage.getItem("ehub-theme");
          dark =
            saved === "dark" ||
            (saved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        } catch (e) {
          try {
            dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          } catch (e2) {}
        }
        if (dark) {
          document.documentElement.classList.add("dark");
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", "#13161d");
        }
      })();
    </script>
    <style>
      html {
        background: #f8f5ef;
        color-scheme: light;
      }
      html.dark {
        background: #13161d;
        color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Questo sito ha bisogno di JavaScript per funzionare.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
